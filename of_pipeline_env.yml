name: of_pipeline_env
channels:
  - defaults

dependencies:
  - python=3.12
  - pip
  - pip:
      # Force the proven working CPU-only PyTorch build.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.13.0+cpu

      # Direct dependencies of the main pipeline.
      - docker==7.1.0
      - trimesh==4.12.2
      - pandas>=2.2,<3
      - reportlab>=4.1,<5

      # Installs FoamAcoustics and its core dependencies from the submodule.
      # Run `conda env create` from the repository root.
      - -e ./acousticSolver
